# Worker-only Railway config. Point the worker service at this file
# (Settings → Config-as-code → /railway.worker.toml) so it does not
# inherit an HTTP healthcheck from railway.toml.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @kairo/server build"

[deploy]
preDeployCommand = ["pnpm --filter @kairo/db migrate:deploy"]
startCommand = "pnpm --filter @kairo/queue start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
