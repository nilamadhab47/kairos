# Railway deploys two services from this monorepo:
#   1. api      \u2192 Fastify HTTP server (apps/server)
#   2. worker   \u2192 BullMQ worker process (packages/queue)
# Postgres and Redis are provisioned as Railway plugins.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @kairo/server build"

[deploy]
# Runs in a separate container before start. Needs `prisma` in @kairo/db dependencies
# (Nixpacks prunes devDependencies). Safe on both api and worker — migrate is idempotent.
preDeployCommand = ["pnpm --filter @kairo/db migrate:deploy"]
# KAIRO_ROLE=worker on the worker service; API serves HTTP.
startCommand = "if [ \"$KAIRO_ROLE\" = \"worker\" ]; then pnpm --filter @kairo/queue start; else pnpm --filter @kairo/server start; fi"
# Liveness only — /api/health also pings Postgres/Redis and can 503 during boot.
# Worker uses railway.worker.toml so it does not inherit this probe.
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# To deploy the worker as a second Railway service, create a service that
# overrides startCommand with:
#   pnpm --filter @kairo/queue start
